{{- if not .Values.nibe.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nibe-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  USERNAME: {{ .Values.nibe.username | quote }}
  PASSWORD: {{ .Values.nibe.password | quote }}
{{- end }}
