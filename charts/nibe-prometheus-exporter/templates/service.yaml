apiVersion: v1
kind: Service
metadata:
  {{- if .Values.metrics.scrape }}
  annotations:
    prometheus.io/port: {{ .Values.metrics.port | quote }}
    prometheus.io/scrape: "true"
  {{- end }}
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nibe-exporter.labels" . | nindent 4 }}
spec:
  ports:
  - name: nibe-prometheus-exporter
    port: {{ .Values.metrics.port }}
    protocol: TCP
    targetPort: metrics
  selector:
    app: nibe-prometheus-exporter
  sessionAffinity: None
  type: {{ .Values.service.type }}
